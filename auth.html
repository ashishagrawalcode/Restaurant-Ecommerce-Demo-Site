<head>
  <meta charset="UTF-8">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="auth.css">
</head>

<body>

  <!-- Header Navigation -->
  <header class="navbar-overlay auth-header-nav">
    <div class="nav-inner">
      <div class="nav-menu-list left">
        <a href="index.html">Home</a>

  </header>

  <!-- Account Access Form Section -->
  <main class="auth-container">
    <div class="auth-card">
      <h2>ACCOUNT ACCESS</h2>
      <form class="auth-form" action="#" method="post">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="guest@saffronplate.com">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••">
        </div>
        <button type="button" class="auth-btn">SIGN IN</button>
      </form>
    </div>
  </main>

  <!-- Footer Section -->
  <footer>

      <span class="brand-name">THE SAFFRON PLATE</span>
      <ul class="footer-simple-links">
