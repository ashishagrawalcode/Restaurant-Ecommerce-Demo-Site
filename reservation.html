<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Table Reservation — The Saffron Plate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="reservation.css">
</head>

<body>

  <!-- Header Navigation -->
  <header class="navbar-overlay res-header-nav">
    <div class="nav-inner">
      <div class="nav-menu-list left">
        <a href="index.html">Home</a>
        <a href="index.html#menu">Menu</a>
        <a href="reservation.html" class="active">Reservations</a>
      </div>
      <a href="index.html" class="brand-center">
        <span class="brand-name">THE SAFFRON PLATE</span>
        <span class="brand-sub">FINE DINING &amp; GOURMET KITCHEN</span>
      </a>
      <div class="nav-menu-list right">
        <a href="about.html">About Us</a>
        <a href="contact.html">Contact</a>
        <a href="auth.html" class="nav-auth-btn">Sign In / Register</a>
      </div>
    </div>
  </header>

  <!-- Reservation Form Section -->
  <main class="res-container">
    <div class="res-card">
      <h2>RESERVE A TABLE</h2>
      <form class="res-form" action="#" method="post">
        
        <div class="form-row">
          <div class="form-group">
            <label for="name">Guest Name</label>
            <input type="text" id="name" class="form-input" placeholder="Your Name">
          </div>
          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" class="form-input" placeholder="+91 9876543210">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="guests">Guests</label>
            <select id="guests" class="form-input">
              <option>2 Guests</option>
              <option>4 Guests</option>
              <option>6 Guests</option>
              <option>8+ Guests</option>
            </select>
          </div>
          <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" class="form-input">
          </div>
        </div>

        <div class="form-group">
          <label for="time">Preferred Time</label>
          <select id="time" class="form-input">
            <option>07:00 PM (Dinner)</option>
            <option>08:30 PM (Dinner)</option>
            <option>01:00 PM (Lunch)</option>
          </select>
        </div>

        <button type="button" class="res-btn">CONFIRM RESERVATION</button>

      </form>
    </div>
  </main>

  <!-- Footer Section -->
  <footer>
    <div class="footer-simple">
      <span class="brand-name">THE SAFFRON PLATE</span>
      <ul class="footer-simple-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="index.html#menu">Menu</a></li>
        <li><a href="reservation.html">Reservations</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="team.html">Our Team</a></li>
        <li><a href="contact.html">Contact Us</a></li>
        <li><a href="auth.html">Sign In / Register</a></li>
      </ul>
      <p>© 2026 The Saffron Plate. All rights reserved.</p>
    </div>
  </footer>

</body>

</html>
